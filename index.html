<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F5F2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161514">
<title>訂單辨識</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="訂單辨識">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <!-- ========== 1. 主畫面 ========== -->
  <section id="view-home" class="view is-active">
    <header class="home-header">
      <span class="app-title">訂單辨識</span>
      <button id="btn-open-settings" class="icon-btn" type="button" aria-label="設定" data-nav="view-settings">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon-gear" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M19.4 13.5c.06-.5.06-1 0-1.5l1.6-1.2-1.5-2.6-1.9.6a7.6 7.6 0 0 0-1.3-.8l-.3-2H10l-.3 2a7.6 7.6 0 0 0-1.3.8l-1.9-.6-1.5 2.6L6.6 12c-.06.5-.06 1 0 1.5L5 14.7l1.5 2.6 1.9-.6c.4.32.85.59 1.3.8l.3 2h4l.3-2c.45-.21.9-.48 1.3-.8l1.9.6 1.5-2.6-1.6-1.2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <div class="home-center">
      <div class="shutter-ring">
        <button id="btn-shutter" class="shutter-btn" type="button" aria-label="拍攝出貨單">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon-camera" aria-hidden="true">
            <path d="M4 8.5C4 7.67157 4.67157 7 5.5 7H7.5L8.6 5.2C8.87 4.75 9.36 4.5 9.87 4.5H14.13C14.64 4.5 15.13 4.75 15.4 5.2L16.5 7H18.5C19.33 7 20 7.67157 20 8.5V17.5C20 18.3284 19.33 19 18.5 19H5.5C4.67157 19 4 18.3284 4 17.5V8.5Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="12" cy="13" r="3.4" stroke="white" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
      <p class="shutter-hint">拍攝出貨單</p>

      <button id="btn-pick-album" class="pill-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon-album" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="8.5" cy="9.5" r="1.4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4 16.5 8.5 12 12 15l2.5-2.5L20 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>從相簿選擇（可多張）</span>
      </button>
    </div>

    <input id="file-input" type="file" accept="image/*" capture="environment" hidden>
    <input id="file-input-multi" type="file" accept="image/*" multiple hidden>

    <footer class="home-footer">
      <div id="setup-hint" class="setup-hint" hidden>尚未設定 API Key／GAS 網址，請先到設定完成初始化</div>
      <div class="footer-card">
        <a id="link-sheet" class="footer-row" href="#" target="_blank" rel="noopener">
          <span>開啟試算表</span>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon-chevron" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div class="footer-divider"></div>
        <a id="link-xlsx" class="footer-row" href="#" target="_blank" rel="noopener">
          <span>下載 Excel</span>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon-chevron" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </footer>
  </section>

  <!-- ========== 2. 辨識中（單張拍照流程） ========== -->
  <section id="view-processing" class="view">
    <div class="processing-center">
      <div class="thumb-wrap">
        <img id="processing-thumb" class="thumb-img" alt="拍攝縮圖">
      </div>
      <div class="spinner" aria-hidden="true"></div>
      <p id="processing-text" class="processing-text">辨識中…</p>
      <div id="processing-error" class="error-box" hidden>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon-warning" aria-hidden="true"><path d="M12 4.5 21 19.5H3L12 4.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="16.7" r="0.9" fill="currentColor" stroke="none"/></svg>
        <p id="processing-error-msg" class="error-msg"></p>
        <button id="btn-retry-scan" class="btn-secondary" type="button">重試</button>
        <button id="btn-retry-retake" class="btn-secondary" type="button">重拍</button>
      </div>
    </div>
  </section>

  <!-- ========== 3. 佇列畫面（批次辨識） ========== -->
  <section id="view-queue" class="view">
    <header class="review-header">
      <button class="icon-btn" id="btn-queue-back" type="button" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="review-title">批次辨識</span>
      <span id="queue-progress" class="header-progress">0 / 0</span>
    </header>

    <div class="review-scroll">
      <div id="queue-list" class="queue-list"></div>
    </div>
  </section>

  <!-- ========== 4. 核對畫面 ========== -->
  <section id="view-review" class="view">
    <header class="review-header">
      <button class="icon-btn" id="btn-review-back" type="button" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="review-title">核對出貨單</span>
      <span id="review-progress" class="header-progress" hidden>1 / 1</span>
    </header>

    <div class="review-scroll">

      <section class="card-block">
        <h2 class="block-title">單頭資訊</h2>
        <div class="field-grid">
          <label class="field field-full">
            <span class="field-label">供應商</span>
            <input class="field-input" id="hdr-supplier" type="text" inputmode="text">
          </label>
          <label class="field">
            <span class="field-label">銷貨單號</span>
            <input class="field-input" id="hdr-salesOrderNo" type="text" inputmode="text">
          </label>
          <label class="field">
            <span class="field-label">銷貨日期</span>
            <input class="field-input" id="hdr-date" type="text" placeholder="YYYY/MM/DD">
          </label>
          <label class="field">
            <span class="field-label">發票號碼</span>
            <input class="field-input" id="hdr-invoiceNo" type="text" inputmode="text">
          </label>
          <label class="field field-full">
            <span class="field-label">客戶名稱</span>
            <input class="field-input" id="hdr-customer" type="text" inputmode="text">
          </label>
        </div>
        <div class="field-grid field-grid-readonly">
          <div class="field">
            <span class="field-label">拍攝時間</span>
            <span class="field-readonly" id="hdr-capturedAt">—</span>
          </div>
          <div class="field">
            <span class="field-label">輸入人員</span>
            <span class="field-readonly" id="hdr-operator">—</span>
          </div>
        </div>
      </section>

      <section class="card-block">
        <div class="block-title-row">
          <h2 class="block-title">明細</h2>
          <button id="btn-add-item" class="btn-add" type="button">＋新增一筆</button>
        </div>
        <div id="items-list" class="items-list"></div>
      </section>

      <div id="mismatch-warning" class="warn-banner" hidden>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon-warning" aria-hidden="true"><path d="M12 4.5 21 19.5H3L12 4.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="16.7" r="0.9" fill="currentColor" stroke="none"/></svg>
        <span id="mismatch-warning-text"></span>
      </div>

      <section class="card-block">
        <h2 class="block-title">合計</h2>
        <div class="field-grid field-grid-totals">
          <label class="field">
            <span class="field-label">未稅合計</span>
            <input class="field-input" id="tot-subtotal" type="text" inputmode="decimal">
          </label>
          <label class="field">
            <span class="field-label">稅額</span>
            <input class="field-input" id="tot-tax" type="text" inputmode="decimal">
          </label>
          <label class="field">
            <span class="field-label">含稅合計</span>
            <input class="field-input" id="tot-total" type="text" inputmode="decimal">
          </label>
        </div>
      </section>

    </div>

    <div class="review-actions">
      <div id="review-submit-error" class="warn-banner" hidden>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon-warning" aria-hidden="true"><path d="M12 4.5 21 19.5H3L12 4.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="16.7" r="0.9" fill="currentColor" stroke="none"/></svg>
        <span id="review-submit-error-msg"></span>
      </div>
      <button id="btn-submit" class="btn-primary" type="button"><span id="btn-submit-label">確認送出</span></button>
      <button id="btn-retake" class="btn-ghost" type="button">重拍</button>
    </div>
  </section>

  <!-- ========== 5. 送出中 / 完成（也用於批次總結） ========== -->
  <section id="view-done" class="view">
    <div class="done-center">
      <div id="done-spinner" class="spinner" aria-hidden="true"></div>
      <div id="done-check" class="done-check" hidden>
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="24" cy="24" r="22" stroke="var(--ok)" stroke-width="2.5"/>
          <path id="done-check-path" d="M14 24.5L20.5 31L34 16" stroke="var(--ok)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p id="done-text" class="done-text">送出中…</p>
      <div id="done-actions" class="done-actions" hidden>
        <button id="btn-done-again" class="btn-primary" type="button">再拍一張</button>
        <a id="link-done-sheet" class="btn-ghost" href="#" target="_blank" rel="noopener">開啟試算表</a>
      </div>
      <div id="done-error" class="error-box" hidden>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon-warning" aria-hidden="true"><path d="M12 4.5 21 19.5H3L12 4.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="16.7" r="0.9" fill="currentColor" stroke="none"/></svg>
        <p id="done-error-msg" class="error-msg"></p>
        <button id="btn-submit-retry" class="btn-secondary" type="button">重試送出</button>
        <button id="btn-submit-back" class="btn-secondary" type="button">返回核對</button>
      </div>
    </div>
  </section>

  <!-- ========== 6. 設定畫面 ========== -->
  <section id="view-settings" class="view">
    <header class="review-header">
      <button class="icon-btn" id="btn-settings-back" type="button" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="review-title">設定</span>
      <span class="icon-btn-spacer"></span>
    </header>

    <div class="review-scroll">
      <section class="card-block">
        <label class="field">
          <span class="field-label">貼上設定連結（快速匯入，免手打金鑰）</span>
          <input class="field-input" id="cfg-import" type="text" inputmode="url" placeholder="貼上 https://…/#cfg=… 連結">
        </label>
        <button id="btn-import-config" class="btn-secondary settings-save" type="button">從連結匯入</button>
      </section>

      <section class="card-block">
        <div class="field-col">
          <label class="field">
            <span class="field-label">輸入人員</span>
            <input class="field-input" id="cfg-operator" type="text" placeholder="姓名">
          </label>

          <label class="field">
            <span class="field-label">Gemini API Key</span>
            <div class="input-with-btn">
              <input class="field-input" id="cfg-apikey" type="password" placeholder="AIza...">
              <button id="btn-toggle-key" class="btn-eye" type="button" aria-label="顯示/隱藏">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
            </div>
          </label>

          <label class="field">
            <span class="field-label">Gemini 模型</span>
            <input class="field-input" id="cfg-model" type="text" placeholder="gemini-flash-latest">
          </label>

          <label class="field">
            <span class="field-label">GAS 網址</span>
            <input class="field-input" id="cfg-gasurl" type="text" placeholder="https://script.google.com/macros/s/.../exec">
          </label>

          <label class="field">
            <span class="field-label">通行碼</span>
            <div class="input-with-btn">
              <input class="field-input" id="cfg-secret" type="password" placeholder="通行碼">
              <button id="btn-toggle-secret" class="btn-eye" type="button" aria-label="顯示/隱藏">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.5"/></svg>
              </button>
            </div>
          </label>
        </div>

        <button id="btn-save-settings" class="btn-primary settings-save" type="button">儲存</button>
      </section>
    </div>

    <footer class="settings-footer">
      <span id="app-version">v1.3.0</span>
    </footer>
  </section>

</div>

<div id="global-toast" class="global-toast" hidden></div>

<template id="item-card-template">
  <div class="item-card">
    <div class="item-card-head">
      <span class="item-card-seq-label">序號</span>
      <input class="item-input item-seq" type="text">
      <button class="btn-item-delete" type="button" aria-label="刪除此筆">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="field-grid">
      <label class="field"><span class="field-label">品號</span><input class="item-input item-productNo" type="text"></label>
      <label class="field field-full"><span class="field-label">品名</span><input class="item-input item-name" type="text"></label>
      <label class="field field-full"><span class="field-label">規格</span><input class="item-input item-spec" type="text"></label>
      <label class="field"><span class="field-label">數量</span><input class="item-input item-qty" type="text" inputmode="decimal"></label>
      <label class="field"><span class="field-label">單位</span><input class="item-input item-unit" type="text"></label>
      <label class="field"><span class="field-label">單價</span><input class="item-input item-unitPrice" type="text" inputmode="decimal"></label>
      <label class="field"><span class="field-label">金額</span><input class="item-input item-amount" type="text" inputmode="decimal"></label>
      <label class="field"><span class="field-label">訂單號碼</span><input class="item-input item-orderNo" type="text"></label>
      <label class="field"><span class="field-label">客戶品號</span><input class="item-input item-customerProductNo" type="text"></label>
    </div>
  </div>
</template>

<template id="queue-card-template">
  <div class="queue-card">
    <img class="queue-card-thumb" alt="縮圖">
    <div class="queue-card-body">
      <span class="queue-card-no">－</span>
      <span class="queue-card-status status-chip"></span>
    </div>
    <button class="btn-queue-retry" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon-retry" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.34 5.66" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4 17v-4.5H8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>重試</span>
    </button>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
